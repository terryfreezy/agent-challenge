<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#0d0f18"/>
  <!-- outer ring dashed -->
  <circle cx="16" cy="16" r="13" stroke="#00d4aa" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- middle ring dashed -->
  <circle cx="16" cy="16" r="9" stroke="#00d4aa" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
  <!-- core dot -->
  <circle cx="16" cy="16" r="3" fill="#00d4aa"/>
  <!-- cross hairs -->
  <line x1="16" y1="2" x2="16" y2="6"   stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="30" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2"  y1="16" x2="6"  y2="16" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="16" x2="30" y2="16" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
</svg>
